<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework SY Website </title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'IBM Plex Sans Thai',system-ui}
body{
  background:#0A1931;
  background-image:
    radial-gradient(at 20% 10%, rgba(255,201,71,0.18) 0%, transparent 55%),
    radial-gradient(at 90% 80%, rgba(255,201,71,0.10) 0%, transparent 45%),
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:100% 100%,100% 100%,42px 42px,42px 42px;
}
::-webkit-scrollbar{display:none}
/* Animations */
@keyframes floatUp { from {opacity:0; transform:translateY(18px) scale(0.98);} to {opacity:1; transform:translateY(0) scale(1);} }
@keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }
@keyframes pulseDot { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.6; transform:scale(0.85)} }
.anim-in{ animation: floatUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
.anim-card{ transition: all 0.35s cubic-bezier(0.16,1,0.3,1); }
.anim-card:hover{ transform: translateY(-4px) scale(1.01); box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
.btn-yellow{ background:#FFC947; color:#0A1931; transition: all 0.25s; }
.btn-yellow:hover{ filter:brightness(1.08); transform:translateY(-1px) scale(1.02); box-shadow:0 8px 24px rgba(255,201,71,0.35); }
.btn-yellow:active{ transform:scale(0.98); }
.shimmer{ position:relative; overflow:hidden; }
.shimmer::after{ content:''; position:absolute; inset:0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent); animation: shimmer 2.2s infinite; }
.card-white{ background:#F8F6F0; box-shadow:0 20px 70px rgba(0,0,0,0.45); }
.card-navy{ background: linear-gradient(180deg, #152E5A 0%, #0A1931 100%); border:1px solid rgba(255,201,71,0.18); box-shadow:0 20px 70px rgba(0,0,0,0.6); }
.live-dot{ width:8px; height:8px; background:#22c55e; border-radius:999px; animation:pulseDot 1.6s infinite; }
</style>
</head>
<body class="min-h-screen text-white">
<div id="root"></div>

<script type="module">
import React,{useState,useEffect,useRef} from 'https://esm.sh/react@18.3.1';
import ReactDOM from 'https://esm.sh/react-dom@18.3.1/client';
import { initializeApp } from 'https://esm.sh/firebase@10.12.2/app';
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from 'https://esm.sh/firebase@10.12.2/firestore';

// ================= FIREBASE CONFIG - แก้ตรงนี้ =================
// เอา config ของคุณมาใส่ตรงนี้เลย มันจะอยู่ในโค้ดตามที่บอก
const firebaseConfig = {
  apiKey: "AIzaSyAqPyy9CfBZeQHA2eWcPQ9W3pEeMnn1JPw",
  authDomain: "homework-5e6f4.firebaseapp.com",
  databaseURL: "https://homework-5e6f4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "homework-5e6f4",
};
const USE_FIREBASE = true;
let db=null, hwCol=null;
if(USE_FIREBASE){
 try{
  const app=initializeApp(firebaseConfig);
  db=getFirestore(app);
  hwCol=collection(db,'homeworks');
 }catch(e){ console.log('Firebase init error',e); }
}

const STORAGE_KEY='homework_v1_realtime';
const ADMIN_PWD='admin123';
const DEFAULT=[
 {id:'1',subject:'คณิตศาสตร์',title:'แบบฝึกหัด บทที่ 5 แคลคูลัส',desc:'ทำหน้า 122 ส่งในสมุด',due:'2025-09-01'},
 {id:'2',subject:'วิทยาศาสตร์',title:'รายงานแลป เคมีอินทรีย์',desc:'สรุปผลการทดลอง',due:'2025-08-28'},
];

function App(){
 const [role,setRole]=useState('login');
 const [items,setItems]=useState([]);
 const [loading,setLoading]=useState(true);
 const [showAdd,setShowAdd]=useState(false);
 const [editId,setEditId]=useState(null);
 const [form,setForm]=useState({subject:'',title:'',desc:'',due:''});
 const [adminInput,setAdminInput]=useState('');
 const [isLive,setIsLive]=useState(false);

 // Realtime Listener
 useEffect(()=>{
  if(USE_FIREBASE && hwCol){
   setIsLive(true);
   const q=query(hwCol, orderBy('createdAt','desc'));
   const unsub=onSnapshot(q,(snap)=>{
    const data=snap.docs.map(d=>({id:d.id, ...d.data()}));
    setItems(data.length?data:DEFAULT);
    setLoading(false);
   }, (err)=>{
    console.error(err);
    setIsLive(false);
    // fallback local
    const s=localStorage.getItem(STORAGE_KEY);
    setItems(s?JSON.parse(s):DEFAULT);
    setLoading(false);
   });
   return ()=>unsub();
  }else{
   // localStorage mode (demo realtime ด้วย interval เล็กๆ)
   const s=localStorage.getItem(STORAGE_KEY);
   setItems(s?JSON.parse(s):DEFAULT);
   setLoading(false);
   setIsLive(false);
   // จำลอง realtime: ถ้ามีอีกแท็บแก้ จะ sync ผ่าน storage event
   const onStorage=(e)=>{ if(e.key===STORAGE_KEY && e.newValue){ setItems(JSON.parse(e.newValue)); } };
   window.addEventListener('storage', onStorage);
   return ()=>window.removeEventListener('storage', onStorage);
  }
 },[]);

 useEffect(()=>{ if(!USE_FIREBASE) localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); },[items]);

 const save=async()=>{
  if(!form.subject||!form.title||!form.due){alert('กรอก วิชา / ชื่องาน / กำหนดส่ง'); return;}
  if(USE_FIREBASE && hwCol){
   if(editId){ await updateDoc(doc(db,'homeworks',editId), {...form, updatedAt: serverTimestamp()}); }
   else { await addDoc(hwCol, {...form, createdAt: serverTimestamp()}); }
  }else{
   if(editId){ setItems(items.map(i=>i.id===editId?{...i,...form}:i)); setEditId(null); }
   else{ setItems([{id:Date.now().toString(),...form},...items]); }
  }
  setForm({subject:'',title:'',desc:'',due:''}); setShowAdd(false);
 };

 const del=async(id)=>{
  if(!confirm('ลบการบ้านนี้?')) return;
  if(USE_FIREBASE && hwCol){ await deleteDoc(doc(db,'homeworks',id)); }
  else{ setItems(items.filter(i=>i.id!==id)); }
 };

 if(role==='login'){
  return React.createElement('div',{className:'min-h-screen flex flex-col items-center justify-center p-4'},
   React.createElement('div',{className:'w-full max-w-[780px] space-y-8 anim-in'},
    React.createElement('div',{className:'text-center space-y-4'},
     React.createElement('div',{className:'inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#FFC947]/10 border border-[#FFC947]/20 text-[10px] tracking-[0.2em] text-[#FFC947]'}, 
      React.createElement('span',{className:'live-dot'}), ` HOMEWORK YORSOR • 2026 • ${isLive?'LIVE REALTIME':'LOCAL DEMO'}`
     ),
     React.createElement('div',{className:'flex justify-center'},
      React.createElement('div',{className:'w-12 h-12 rounded-[14px] bg-white flex items-center justify-center text-[#0A1931] text-xl shadow-lg'},'📚')
     ),
     React.createElement('h1',{className:'text-[32px] font-bold leading-[0.95]'},
      'ระบบจัดการ', React.createElement('br'), React.createElement('span',{className:'text-[#FFC947]'},'การบ้าน')
     ),
     React.createElement('p',{className:'text-[12px] text-white/40'}, 'Navy Yellow • Animation + Realtime Firebase')
    ),
    React.createElement('div',{className:'grid md:grid-cols-2 gap-5'},
     // Viewer
     React.createElement('div',{className:'card-white rounded-[22px] p-6 text-[#0A1931] anim-card', style:{animationDelay:'0.1s'}},
      React.createElement('div',{className:'flex justify-between mb-4'},
       React.createElement('span',{className:'w-7 h-7 rounded-full bg-black/5 flex items-center justify-center text-xs'},'👁️'),
       React.createElement('span',{className:'text-[9px] tracking-widest opacity-40'},'VIEW ONLY')
      ),
      React.createElement('h3',{className:'font-bold'},'เข้าสู่ระบบ (ดูอย่างเดียว)'),
      React.createElement('p',{className:'text-[11px] opacity-60 mt-1 leading-relaxed'},'ดูการบ้านทั้งหมดแบบ Realtime ไม่ต้องล็อกอิน เห็นอัปเดตทันทีเมื่อแอดมินแก้ไข'),
      React.createElement('div',{className:'mt-4 flex items-center gap-2 text-[11px]'},
       React.createElement('span',{className:'live-dot', style:{background:'#0A1931'}}), ' Realtime Sync'
      ),
      React.createElement('button',{onClick:()=>setRole('viewer'),className:'w-full mt-6 h-11 rounded-full border border-[#0A1931] font-semibold text-[13px] hover:bg-[#0A1931] hover:text-white transition'},'เข้าสู่ระบบ →')
     ),
     // Admin
     React.createElement('div',{className:'card-navy rounded-[22px] p-6 anim-card', style:{animationDelay:'0.2s'}},
      React.createElement('div',{className:'flex justify-between mb-4'},
       React.createElement('div',{className:'w-7 h-7 rounded-[10px] bg-[#FFC947] flex items-center justify-center text-[#0A1931] text-xs'},'🔒'),
       React.createElement('span',{className:'text-[9px] px-2 py-1 rounded-full bg-[#FFC947] text-[#0A1931] font-bold'},'ADMIN SECURE')
      ),
      React.createElement('h3',{className:'font-bold'},'เข้าสู่ระบบแอดมิน'),
      React.createElement('p',{className:'text-[11px] text-white/50 mt-1'},'แก้ไขได้แบบ Realtime ทุกเครื่องเห็นพร้อมกัน'),
      React.createElement('div',{className:'mt-5 relative'},
       React.createElement('input',{type:'password',placeholder:'ใส่รหัสแอดมิน',value:adminInput,onChange:e=>setAdminInput(e.target.value),onKeyDown:e=>{if(e.key==='Enter'){ if(adminInput===ADMIN_PWD) setRole('admin'); }}, className:'w-full h-11 rounded-full bg-white text-[#0A1931] px-4 pr-12 text-[13px] outline-none'}),
       React.createElement('button',{onClick:()=>{ if(adminInput===ADMIN_PWD) setRole('admin'); else alert('รหัสไม่ถูก'); },className:'absolute right-1 top-1 w-9 h-9 rounded-full bg-[#0A1931] text-white flex items-center justify-center'},'→')
      ),
      React.createElement('button',{onClick:()=>{ if(adminInput===ADMIN_PWD) setRole('admin'); else { const p=prompt('รหัสแอดมิน'); if(p===ADMIN_PWD) setRole('admin'); } },className:'w-full mt-4 h-11 rounded-full btn-yellow text-[13px] shimmer'},'✦ เข้าสู่ระบบแอดมิน')
     )
    )
   )
  );
 }

 return React.createElement('div',{className:'min-h-screen'},
  React.createElement('div',{className:'max-w-[920px] mx-auto p-4 md:p-6 space-y-5'},
   React.createElement('div',{className:'flex items-center justify-between anim-in'},
    React.createElement('div',{className:'flex items-center gap-3'},
     React.createElement('div',{className:'w-9 h-9 rounded-full bg-[#FFC947] text-[#0A1931] font-bold flex items-center justify-center'},'H'),
     React.createElement('div',null,
      React.createElement('h1',{className:'font-bold text-[15px] flex items-center gap-2'},'ระบบจัดการการบ้าน',
       React.createElement('span',{className:`flex items-center gap-1.5 text-[10px] px-2 py-0.5 rounded-full ${isLive?'bg-green-500/20 text-green-300 border border-green-500/30':'bg-white/10 text-white/60 border border-white/10'}`},
        React.createElement('span',{className:'live-dot', style:{background:isLive?'#22c55e':'#fff'}}), isLive?'LIVE • FIREBASE':'LOCAL • DEMO'
       )
      ),
      React.createElement('p',{className:'text-[10px] text-white/40'}, loading?'กำลังซิงค์...':`${items.length} รายการ • Realtime`)
     )
    ),
    React.createElement('div',{className:'flex gap-2'},
     React.createElement('button',{onClick:()=>setRole('login'),className:'px-4 py-2 rounded-full bg-white/10 border border-white/10 text-xs'},'ออก'),
     role==='admin'?React.createElement('button',{onClick:()=>{setEditId(null);setForm({subject:'',title:'',desc:'',due:''});setShowAdd(true);},className:'px-5 py-2 rounded-full btn-yellow text-xs'},'+ เพิ่ม'):null
    )
   ),
   loading?React.createElement('div',{className:'py-20 text-center'},
    React.createElement('div',{className:'w-8 h-8 border-2 border-[#FFC947]/30 border-t-[#FFC947] rounded-full animate-spin mx-auto'}),
    React.createElement('p',{className:'text-xs text-white/40 mt-3'},'กำลังซิงค์ข้อมูล Realtime...')
   ):
   React.createElement('div',{className:'grid md:grid-cols-2 gap-3'},
    items.map((hw,i)=>React.createElement('div',{key:hw.id,className:'anim-card rounded-[18px] bg-[#F8F6F0] p-5 text-[#0A1931] anim-in', style:{animationDelay:`${i*0.06}s`}},
     React.createElement('div',{className:'flex justify-between'},
      React.createElement('span',{className:'text-[11px] px-2.5 py-1 rounded-full bg-[#0A1931] text-white'},hw.subject),
      React.createElement('span',{className:'text-[11px] text-black/40'}, hw.due?new Date(hw.due).toLocaleDateString('th-TH'):'-')
     ),
     React.createElement('h3',{className:'font-semibold mt-3 text-[14px]'},hw.title),
     React.createElement('p',{className:'text-[12px] text-black/60 mt-1'},hw.desc),
     role==='admin'?React.createElement('div',{className:'flex gap-2 mt-4'},
      React.createElement('button',{onClick:()=>{setForm({subject:hw.subject,title:hw.title,desc:hw.desc,due:hw.due});setEditId(hw.id);setShowAdd(true);},className:'px-4 py-1.5 rounded-full bg-[#0A1931] text-white text-xs hover:scale-105 transition'},'แก้ไข'),
      React.createElement('button',{onClick:()=>del(hw.id),className:'px-4 py-1.5 rounded-full border text-xs text-red-600 hover:bg-red-50 transition'},'ลบ')
     ):null
    ))
   )
  ),
  showAdd?React.createElement('div',{className:'fixed inset-0 bg-[#0A1931]/80 backdrop-blur-[12px] flex items-center justify-center p-4 z-50'},
   React.createElement('div',{className:'w-full max-w-md bg-[#F8F6F0] rounded-[24px] p-6 space-y-3 text-[#0A1931] anim-in'},
    React.createElement('div',{className:'flex justify-between items-center'},
     React.createElement('h3',{className:'font-bold'},editId?'แก้ไข':'เพิ่มการบ้านใหม่'),
     React.createElement('span',{className:`text-[10px] px-2 py-1 rounded-full ${isLive?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}`}, isLive?'LIVE SAVE':'LOCAL SAVE')
    ),
    React.createElement('input',{placeholder:'วิชา',value:form.subject,onChange:e=>setForm({...form,subject:e.target.value}),className:'w-full p-3 rounded-xl bg-black/[0.05] border text-sm outline-none focus:ring-2 focus:ring-[#FFC947]'}),
    React.createElement('input',{placeholder:'ชื่องาน',value:form.title,onChange:e=>setForm({...form,title:e.target.value}),className:'w-full p-3 rounded-xl bg-black/[0.05] border text-sm outline-none focus:ring-2 focus:ring-[#FFC947]'}),
    React.createElement('textarea',{placeholder:'รายละเอียด',value:form.desc,onChange:e=>setForm({...form,desc:e.target.value}),className:'w-full p-3 rounded-xl bg-black/[0.05] border text-sm outline-none focus:ring-2 focus:ring-[#FFC947]'}),
    React.createElement('input',{type:'date',value:form.due,onChange:e=>setForm({...form,due:e.target.value}),className:'w-full p-3 rounded-xl bg-black/[0.05] border text-sm'}),
    React.createElement('div',{className:'flex gap-2'},
     React.createElement('button',{onClick:save,className:'flex-1 h-11 rounded-full bg-[#0A1931] text-white text-sm btn-yellow'}, isLive?'บันทึก Realtime':'บันทึก'),
     React.createElement('button',{onClick:()=>setShowAdd(false),className:'px-6 h-11 rounded-full border text-sm'},'ปิด')
    )
   )
  ):null
 );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
